name: Continuation CI/CD

on: [push, pull_request]

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.plat.os }}
    runs-on: ${{ matrix.plat.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        plat: 
        - { os: ubuntu-latest, target: "", arch: x86_64, homebrew: ''}
        - { os: macos-13, target: "13.0" , arch: x86_64, homebrew: '/usr/local'}
        - { os: macos-14, target: "14.0" , arch: arm64, homebrew: '/opt/homebrew'}

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.19.0
        env:
          CIBW_BUILD: cp38-* cp39-* cp310-* cp311-* cp312-*
          CIBW_ARCHS: ${{ matrix.plat.arch }}
          CIBW_MANYLINUX_X86_64_IMAGE: "manylinux2014"
          # Replace the default old HDF5 shipped on CentOS7 (1.8.12) by building a compatible HDF5 >=1.10.7.
          CIBW_BEFORE_ALL_LINUX: |
            set -eux
            # Switch CentOS mirrors to vault (needed on some runners)
            sed -i -e 's/mirrorlist/#mirrorlist/g' -e 's|#baseurl=http://mirror.centos.org|baseurl=http://vault.centos.org|g' /etc/yum.repos.d/CentOS-*
            # Install build deps
            yum install -y epel-release wget tar gcc gcc-c++ make perl zlib-devel
            # Remove older HDF5 packages if present (CentOS7 default is 1.8.12)
            yum remove -y hdf5 hdf5-devel || true
            # Download and build HDF5 1.10.8 (compatible with h5py)
            HDF5_VER=1.10.8
            wget -q https://support.hdfgroup.org/ftp/HDF5/releases/hdf5-1.10/hdf5-1.10.8/src/hdf5-1.10.8.tar.gz
            tar -xzf hdf5-1.10.8.tar.gz
            cd hdf5-1.10.8
            ./configure --prefix=/usr/local --enable-shared
            make -j"$(nproc)"
            make -j"$(nproc)" install
            cd ..
            rm -rf hdf5-1.10.8 hdf5-1.10.8.tar.gz
            # Ensure the new library path is visible
            ldconfig
        
          CIBW_ENVIRONMENT_MACOS: >
            GMP_DIR=${{ matrix.plat.homebrew }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.plat.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl

  build_wheels_13:
    name: Build wheels on ${{ matrix.plat.os }}
    runs-on: ${{ matrix.plat.os }}
    strategy:
      matrix:
        # macos-13 is an intel runner, macos-14 is apple silicon
        plat: 
        - { os: ubuntu-latest, target: "", arch: x86_64, homebrew: ''}
        - { os: macos-13, target: "13.0" , arch: x86_64, homebrew: '/usr/local'}
        - { os: macos-14, target: "14.0" , arch: arm64, homebrew: '/opt/homebrew'}

    steps:
      - uses: actions/checkout@v4

      - name: Build wheels
        uses: pypa/cibuildwheel@v2.23.0
        env:
          CIBW_BUILD: cp313-*
          CIBW_ARCHS: ${{ matrix.plat.arch }}

          CIBW_ENVIRONMENT_MACOS: >
            GMP_DIR=${{ matrix.plat.homebrew }}
            MACOSX_DEPLOYMENT_TARGET=${{ matrix.plat.target }}

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-wheels-${{ matrix.plat.os }}-${{ strategy.job-index }}-13
          path: ./wheelhouse/*.whl



  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build sdist
        run: pipx run build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: cibw-sdist
          path: dist/*.tar.gz

  upload_pypi:
    needs: [build_wheels, build_wheels_13, build_sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    #if: github.event_name == 'release' && github.event.action == 'published'
    # or, alternatively, upload to PyPI on every tag starting with 'v' (remove on: release above to use this)
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
    steps:
      - uses: actions/download-artifact@v4
        with:
          # unpacks all CIBW artifacts into dist/
          pattern: cibw-*
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        #with:
          # To test: 
          # repository-url: https://test.pypi.org/legacy/
